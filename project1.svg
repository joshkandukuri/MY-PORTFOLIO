<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e21"/>
      <stop offset="100%" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <circle cx="150" cy="150" r="100" fill="#00f0ff" opacity="0.08" filter="url(#glow1)"/>
  <circle cx="650" cy="300" r="120" fill="#a855f7" opacity="0.09" filter="url(#glow1)"/>
  
  <!-- Neural Links -->
  <g stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="200" y1="150" x2="380" y2="110"/>
    <line x1="200" y1="150" x2="380" y2="220"/>
    <line x1="200" y1="150" x2="380" y2="330"/>
    <line x1="200" y1="270" x2="380" y2="110"/>
    <line x1="200" y1="270" x2="380" y2="220"/>
    <line x1="200" y1="270" x2="380" y2="330"/>
    <line x1="380" y1="110" x2="580" y2="180" stroke="#a855f7" stroke-opacity="0.45"/>
    <line x1="380" y1="220" x2="580" y2="180" stroke="#a855f7" stroke-opacity="0.45"/>
    <line x1="380" y1="330" x2="580" y2="270" stroke="#a855f7" stroke-opacity="0.45"/>
  </g>
  
  <!-- Pulse Particles -->
  <circle cx="290" cy="130" r="3" fill="#00f0ff" filter="url(#glow1)"/>
  <circle cx="290" cy="245" r="3.5" fill="#00e5ff" filter="url(#glow1)"/>
  <circle cx="480" cy="145" r="3.5" fill="#a855f7" filter="url(#glow1)"/>
  
  <!-- Nodes -->
  <circle cx="200" cy="150" r="15" fill="#060d24" stroke="#00f0ff" stroke-width="3" filter="url(#glow1)"/>
  <circle cx="200" cy="270" r="15" fill="#060d24" stroke="#00f0ff" stroke-width="3" filter="url(#glow1)"/>
  <circle cx="380" cy="110" r="13" fill="#060d24" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow1)"/>
  <circle cx="380" cy="220" r="13" fill="#060d24" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow1)"/>
  <circle cx="380" cy="330" r="13" fill="#060d24" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow1)"/>
  <circle cx="580" cy="180" r="16" fill="#060d24" stroke="#a855f7" stroke-width="3" filter="url(#glow1)"/>
  <circle cx="580" cy="270" r="16" fill="#060d24" stroke="#a855f7" stroke-width="3" filter="url(#glow1)"/>

  <text x="400" y="405" fill="#8ee3ff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" text-anchor="middle" letter-spacing="3">AI &amp; DEEP NEURAL NETWORK VISION</text>
</svg>
